# Name of the Spring Boot application
spring.application.name=bookmyscreen-backend

# Connect Spring Boot to the BookMyScreen MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyscreen

# MySQL username
spring.datasource.username=root

# MySQL password
spring.datasource.password=${MYSQL_PASSWORD}

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate will automatically create/update tables from our @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in the IntelliJ console
spring.jpa.show-sql=true

# Make displayed SQL easier to read
spring.jpa.properties.hibernate.format_sql=true

# Secret key used for JWT tokens
jwt.secret=${JWT_SECRET}

# Access token expires after 1 hour
jwt.access-expiration=3600000

# Refresh token expires after 7 days
jwt.refresh-expiration=604800000